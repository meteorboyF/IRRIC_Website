# Serves the prerendered site with real response headers, which GitHub Pages
# cannot send. That includes clickjacking protection (frame-ancestors and
# X-Frame-Options), which a <meta> CSP cannot provide.
#
# $page_csp comes from 00-csp-map.conf, generated by scripts/postbuild.mjs:
# each page's policy allows only the SHA-256 hashes of that page's own
# inline scripts. The same policy is also in a <meta> tag on every page.

# Hashed bundle files can be cached forever; images change on redeploys, so
# they get a day; HTML always revalidates so a deploy is visible at once.
map $uri $iriic_cache_control {
    default        "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
    ~^/images/     "public, max-age=86400";
    ~^/fonts/      "public, max-age=31536000, immutable";
}

server {
    # The unprivileged image runs as uid 101 and cannot bind port 80.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Do not advertise the nginx version on responses or error pages.
    server_tokens off;

    # Keep redirects relative so they survive a TLS-terminating proxy.
    absolute_redirect off;

    # All headers live at server level: nginx drops inherited add_header
    # directives in any block that declares its own, so no location below
    # adds headers.
    add_header Content-Security-Policy $page_csp always;
    add_header Cache-Control $iriic_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()" always;

    # ------------------------------------------------------------------
    # HSTS: ENABLE ONLY WHEN THIS SITE IS SERVED OVER HTTPS.
    # Browsers remember it for max-age, so turning it on for a plain-HTTP
    # deployment locks visitors out. Uncomment once TLS is in front of this
    # container (the reverse proxy may already send it; do not send twice).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ------------------------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Only GET and HEAD make sense for a static site.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        # Routes are built with trailing slashes; send /about to /about/
        # rather than serving one page at two URLs.
        if (-d $document_root$uri) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        try_files $uri $uri/index.html =404;
    }

    # Deployment metadata that should never be served.
    location ~ (^|/)\.(?!well-known/) {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
